name: Quality and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:production

  release:
    name: Publish dataset release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Publish a release when the data version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .data_version public/data/manifest.json)
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already published; nothing to do."
            exit 0
          fi
          methodology=$(jq -r .methodology_version public/data/manifest.json)
          start=$(jq -r .monthly.coverage_start public/data/manifest.json)
          end=$(jq -r .monthly.coverage_end public/data/manifest.json)
          gh release create "$tag" \
            --title "Data $version" \
            --notes "Methodology $methodology. Coverage $start to $end." \
            public/data/factors_daily.csv \
            public/data/factors_monthly.csv \
            public/data/manifest.json \
            public/data/stats.json

  deploy:
    name: Deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ENABLE_PAGES_DEPLOYMENT == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate:publication
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://g-lad81.github.io' }}
          PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH || '/factor-lib-il/' }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
